paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Service health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/setup:
    post:
      operationId: setupHousehold
      summary: First-run household setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Household created; family session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "403":
          description: Caller is outside FAMILY_LOGIN_NETWORKS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A household already exists (v1 = one household per install)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed or unknown timezone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/identities:
    get:
      operationId: listIdentities
      summary: Login-screen identity list (unauthenticated)
      responses:
        "200":
          description: Household members with available login methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitiesResponse"
  /api/v1/auth/network:
    get:
      operationId: getNetworkInfo
      summary: Whether family/service login is allowed from the caller IP
      responses:
        "200":
          description: Network fencing verdict for the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkInfo"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Password login (family, member, or service scope)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Family/service login is fenced to FAMILY_LOGIN_NETWORKS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed (e.g. memberId missing for scope=member)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts; Retry-After header carries the wait in
            seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Service login disabled (no SERVICE_PASSWORD configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No household configured yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/password-setup:
    post:
      operationId: claimPasswordSetup
      summary: First-login / post-reset password claim (armed members only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordSetupRequest"
      responses:
        "200":
          description: Password set; member session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Family password incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Claiming a tile is fenced to FAMILY_LOGIN_NETWORKS, like family login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Member is not armed for setup (setup_not_allowed) — an admin resets
            first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts; Retry-After header carries the wait in
            seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No household configured yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Delete the current session
      responses:
        "204":
          description: Session deleted and cookie cleared
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: Current session info

        - schema:
            type: string
            enum:
              - redeemed
              - fulfilled
          required: false
          name: status
          in: query
        - schema:
            type: string
            pattern: ^\d{1,3}$
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Redemptions (default 50, max 200), optionally by member/status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardRedemptionList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Malformed query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/reward-redemptions/{id}/return:
    post:
      operationId: returnRedemption
      summary: Return an unfulfilled redemption — the mis-click undo (stars refunded)
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Returned; the record and its ledger spend are gone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Redemption not found in this household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already fulfilled — correct it with a star adjustment
            (already_fulfilled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/reward-redemptions/{id}/fulfill:
    post:
      operationId: fulfillRedemption
      summary: Mark a redemption done in the real world (admin)
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Fulfilled (idempotent — an already-fulfilled row returns as-is)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardRedemption"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Redemption not found in this household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/stars/balances:
    get:
      operationId: getStarBalances
      summary: Star balances for every household member
      responses:
        "200":
          description: One entry per member (0 for members with no ledger history)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarBalanceList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/stars/ledger:
    get:
      operationId: getStarLedger
      summary: Recent star ledger entries, newest first
      parameters:
        - schema:
            type: string
            maxLength: 64
          required: false
          name: memberId
          in: query
        - schema:
            type: string
            pattern: ^\d{1,3}$
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Ledger page (default 50, max 200 entries)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarLedgerList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Malformed query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/stars/adjust:
    post:
      operationId: adjustStars
      summary: Manual star correction (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarAdjust"
      responses:
        "200":
          description: Adjustment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarLedgerList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Adjustment would drive the balance negative (insufficient_stars)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: memberId is not a household member, or delta is zero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/push/vapid-key:
    get:
      operationId: getVapidKey
      summary: The install's VAPID public key (generated lazily on first fetch)
      responses:
        "200":
          description: The applicationServerKey for web-push subscribe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidKey"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/devices:
    post:
      operationId: registerDevice
      summary: Register this device for APNs pushes (member sessions only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegister"
      responses:
        "200":
          description: The registration (a re-register moves the token to this member)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: A device is personal — family/kiosk and service sessions cannot
            register one (member_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDevice
      summary: Unregister a device by token (sign-out flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceDelete"
      responses:
        "204":
          description: Gone (idempotent — 204 whether or not a row matched)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/push/subscriptions:
    post:
      operationId: createPushSubscription
      summary: Register a web-push subscription (member-less for family/kiosk screens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionCreate"
      responses:
        "200":
          description: The subscription (a re-subscribe updates the rotated keys in place)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listPushSubscriptions
      summary: The household's registered web-push subscriptions
      responses:
        "200":
          description: All subscriptions, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePushSubscription
      summary: Remove a web-push subscription by endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionDelete"
      responses:
        "204":
          description: Gone (idempotent — 204 whether or not a row matched)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

openapi: 3.0.3
info:
  title: Diane API
  version: 0.1.0
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          example: api
        version:
          type: string
          example: 0.1.0
        gitSha:
          type: string
          nullable: true
          example: abc1234
        time:
          type: string
          example: 2026-07-13T12:00:00.000Z
      required:
        - status
        - service
        - version
        - gitSha
        - time
    Error:
      type: object
      properties:
        error:
          type: string
          example: not_found
        code:
          type: string
          example: E_NOT_FOUND
      required:
        - error
    TokenResponse:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/SessionInfo"
        token:
          type: string
      required:
        - session
        - token
    SessionInfo:
      type: object
      properties:
        kind:
          type: string
          enum:
            - family
            - member
            - service
        member:
          $ref: "#/components/schemas/SessionMember"
        canAdmin:
          type: boolean
        expiresAt:
          type: string
      required:
        - kind
        - member
        - canAdmin
        - expiresAt
    SessionMember:
      type: object
      nullable: true
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
        role:
          $ref: "#/components/schemas/Role"
      required:
        - id
        - name
        - color
        - role
    Role:
      type: string
      enum:
        - mom
        - dad
        - kid
    SetupRequest:
      type: object
      properties:
        householdName:
          type: string
          minLength: 1
          maxLength: 80
        tz:
          type: string
          minLength: 1
          example: Europe/Warsaw
        familyPassword:
          type: string
          minLength: 8
          maxLength: 200
      required:
        - householdName
        - tz
        - familyPassword
    IdentitiesResponse:
      type: object
      properties:
        configured:
          type: boolean
        householdName:
          type: string
          nullable: true
        restricted:
          type: boolean
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberIdentity"
      required:
        - configured
        - householdName
        - restricted
        - members
    MemberIdentity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          example: "#e5484d"
        role:
          type: string
          nullable: true
          enum:
            - mom
            - dad
            - kid
            - null
        avatar:
          type: string
          nullable: true
        hasPassword:
          type: boolean
          nullable: true
        hasPasskeys:
          type: boolean
          nullable: true
        passwordResetRequired:
          type: boolean
          nullable: true
      required:
        - id
        - name
        - color
        - role
        - avatar
        - hasPassword
        - hasPasskeys
        - passwordResetRequired
    NetworkInfo:
      type: object
      properties:
        familyLoginAllowed:
          type: boolean
      required:
        - familyLoginAllowed
    LoginRequest:
      type: object
      properties:
        scope:
          type: string
          enum:
            - family
            - member
            - service
        memberId:
          type: string
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 200
        label:
          type: string
          maxLength: 80
      required:
        - scope
        - password
    PasswordSetupRequest:
      type: object
      properties:
        memberId:
          type: string
          maxLength: 64
        familyPassword:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 8
          maxLength: 200
        label:
          type: string
          maxLength: 80
      required:
        - memberId
        - familyPassword
        - password
    WebAuthnOptionsResponse:
      type: object
      properties:
        requestId:
          type: string
        options:
          type: object
          additionalProperties:
            nullable: true
      required:
        - requestId
        - options
    WebAuthnOptionsRequest:
      type: object
      properties:
        memberId:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - memberId
    WebAuthnCredentialCreated:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
          nullable: true
      required:
        - id
        - label
    WebAuthnRegisterVerifyRequest:
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
        response:
          type: object
          additionalProperties:
            nullable: true
        label:
          type: string
          maxLength: 80
      required:
        - requestId
        - response
    WebAuthnLoginVerifyRequest:
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
        response:
          type: object
          additionalProperties:
            nullable: true
      required:
        - requestId
        - response
    MemberList:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
      required:
        - members
    Member:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        avatar:
          type: string
          nullable: true
        birthday:
          type: string
          nullable: true
        choreReminderTime:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/Role"
        sortOrder:
          type: integer
        hasPassword:
          type: boolean
        hasPasskeys:
          type: boolean
        passwordResetRequired:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - name
        - color
        - avatar
        - birthday
        - choreReminderTime
        - role
        - sortOrder
        - hasPassword
        - hasPasskeys
        - passwordResetRequired
        - createdAt
    MemberCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        role:
          $ref: "#/components/schemas/Role"
        avatar:
          type: string
          nullable: true
          maxLength: 400000
          pattern: ^data:image\/(jpeg|png|webp);base64,
        birthday:
          type: string
          nullable: true
          pattern: ^\d{4}-\d{2}-\d{2}$
        sortOrder:
          type: integer
          minimum: 0
          maximum: 100000
      required:
        - name
        - color
    MemberUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        role:
          $ref: "#/components/schemas/Role"
        avatar:
          type: string
          nullable: true
          maxLength: 400000
          pattern: ^data:image\/(jpeg|png|webp);base64,
        birthday:
          type: string
          nullable: true
          pattern: ^\d{4}-\d{2}-\d{2}$
        choreReminderTime:
          type: string
          nullable: true
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 18:00
        sortOrder:
          type: integer
          minimum: 0
          maximum: 100000
    SetPasswordRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 200
      required:
        - password
    PasskeyList:
      type: object
      properties:
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
      required:
        - passkeys
    Passkey:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - label
        - createdAt
    Household:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tz:
          type: string
          example: Europe/Warsaw
        weatherLocation:
          type: object
          nullable: true
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lon:
              type: number
              minimum: -180
              maximum: 180
            label:
              type: string
              minLength: 1
              maxLength: 80
          required:
            - lat
            - lon
            - label
        modules:
          $ref: "#/components/schemas/HouseholdModules"
        createdAt:
          type: string
      required:
        - id
        - name
        - tz
        - weatherLocation
        - modules
        - createdAt
    HouseholdModules:
      type: object
      properties:
        chores:
          type: boolean
        routines:
          type: boolean
        rewards:
          type: boolean
      required:
        - chores
        - routines
        - rewards
    HouseholdUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        tz:
          type: string
          minLength: 1
        weatherLocation:
          type: object
          nullable: true
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lon:
              type: number
              minimum: -180
              maximum: 180
            label:
              type: string
              minLength: 1
              maxLength: 80
          required:
            - lat
            - lon
            - label
        modules:
          type: object
          properties:
            chores:
              type: boolean
            routines:
              type: boolean
            rewards:
              type: boolean
    CalendarAccountList:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/CalendarAccount"
      required:
        - accounts
    CalendarAccount:
      type: object
      properties:
        id:
          type: string
        ownerMemberId:
          type: string
          nullable: true
        provider:
          $ref: "#/components/schemas/CalDavProvider"
        label:
          type: string
        username:
          type: string
        serverUrl:
          type: string
          nullable: true
        authError:
          type: string
          nullable: true
        authBackoffUntil:
          type: string
          nullable: true
        lastSyncAt:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - ownerMemberId
        - provider
        - label
        - username
        - serverUrl
        - authError
        - authBackoffUntil
        - lastSyncAt
        - createdAt
    CalDavProvider:
      type: string
      enum:
        - icloud
        - caldav
    CalendarAccountCreate:
      type: object
      properties:
        ownerMemberId:
          type: string
        provider:
          $ref: "#/components/schemas/CalDavProvider"
        label:
          type: string
          minLength: 1
          maxLength: 80
        username:
          type: string
          minLength: 1
          maxLength: 200
        appPassword:
          type: string
          minLength: 1
          maxLength: 200
        serverUrl:
          type: string
          maxLength: 500
          format: uri
      required:
        - provider
        - username
        - appPassword
    CalendarAccountUpdate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        username:
          type: string
          minLength: 1
          maxLength: 200
        appPassword:
          type: string
          minLength: 1
          maxLength: 200
        serverUrl:
          type: string
          maxLength: 500
          format: uri
    SyncQueued:
      type: object
      properties:
        status:
          type: string
          enum:
            - queued
      required:
        - status
    SyncRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
    CalendarList:
      type: object
      properties:
        calendars:
          type: array
          items:
            $ref: "#/components/schemas/Calendar"
      required:
        - calendars
    Calendar:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
          nullable: true
        ownerMemberId:
          type: string
          nullable: true
        displayName:
          type: string
        color:
          type: string
          nullable: true
        providerColor:
          type: string
          nullable: true
        memberId:
          type: string
          nullable: true
        enabled:
          type: boolean
        writable:
          type: boolean
        lastSyncAt:
          type: string
          nullable: true
        lastSyncError:
          type: string
          nullable: true
        eventCount:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - accountId
        - ownerMemberId
        - displayName
        - color
        - providerColor
        - memberId
        - enabled
        - writable
        - lastSyncAt
        - lastSyncError
        - eventCount
        - createdAt
    CalendarCreate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          nullable: true
          pattern: ^#[0-9a-fA-F]{6}$
        memberId:
          type: string
          nullable: true
          maxLength: 64
      required:
        - displayName
    CalendarUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        writable:
          type: boolean
        memberId:
          type: string
          nullable: true
          maxLength: 64
        color:
          type: string
          nullable: true
          pattern: ^#[0-9a-fA-F]{6}$
    EventOccurrenceList:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventOccurrence"
      required:
        - events
    EventOccurrence:
      type: object
      properties:
        id:
          type: string
        eventId:
          type: string
        calendarId:
          type: string
        summary:
          type: string
        location:
          type: string
          nullable: true
        allDay:
          type: boolean
        startsAt:
          type: string
          nullable: true
        endsAt:
          type: string
          nullable: true
        startDate:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
        memberIds:
          type: array
          nullable: true
          items:
            type: string
        color:
          type: string
          nullable: true
        recurrence:
          type: object
          nullable: true
          properties:
            freq:
              type: string
              enum:
                - daily
                - weekly
                - monthly
                - yearly
            interval:
              type: integer
              minimum: 1
              maximum: 365
            byWeekday:
              type: array
              items:
                type: string
                enum:
                  - mo
                  - tu
                  - we
                  - th
                  - fr
                  - sa
                  - su
              maxItems: 7
            byMonthDay:
              type: integer
              minimum: 1
              maximum: 31
            until:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
          required:
            - freq
        seriesStartsAt:
          type: string
          nullable: true
        seriesStartDate:
          type: string
          nullable: true
      required:
        - id
        - eventId
        - calendarId
        - summary
        - location
        - allDay
        - startsAt
        - endsAt
        - startDate
        - endDate
        - memberIds
        - color
        - recurrence
        - seriesStartsAt
        - seriesStartDate
    EventCreated:
      type: object
      properties:
        id:
          type: string
        calendarId:
          type: string
        summary:
          type: string
        syncStatus:
          type: string
          enum:
            - local
            - push-pending
      required:
        - id
        - calendarId
        - summary
        - syncStatus
    EventCreate:
      type: object
      properties:
        calendarId:
          type: string
          maxLength: 64
        summary:
          type: string
          minLength: 1
          maxLength: 200
        location:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
        memberIds:
          type: array
          nullable: true
          items:
            type: string
            maxLength: 64
          maxItems: 20
        allDay:
          type: boolean
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        startDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        endDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        recurrence:
          type: object
          nullable: true
          properties:
            freq:
              type: string
              enum:
                - daily
                - weekly
                - monthly
                - yearly
            interval:
              type: integer
              minimum: 1
              maximum: 365
            byWeekday:
              type: array
              items:
                type: string
                enum:
                  - mo
                  - tu
                  - we
                  - th
                  - fr
                  - sa
                  - su
              maxItems: 7
            byMonthDay:
              type: integer
              minimum: 1
              maximum: 31
            until:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
          required:
            - freq
      required:
        - calendarId
        - summary
        - allDay
    EventUpdate:
      type: object
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 200
        location:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
        memberIds:
          type: array
          nullable: true
          items:
            type: string
            maxLength: 64
          maxItems: 20
        allDay:
          type: boolean
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        startDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        endDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        recurrence:
          type: object
          nullable: true
          properties:
            freq:
              type: string
              enum:
                - daily
                - weekly
                - monthly
                - yearly
            interval:
              type: integer
              minimum: 1
              maximum: 365
            byWeekday:
              type: array
              items:
                type: string
                enum:
                  - mo
                  - tu
                  - we
                  - th
                  - fr
                  - sa
                  - su
              maxItems: 7
            byMonthDay:
              type: integer
              minimum: 1
              maximum: 31
            until:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
          required:
            - freq
      required:
        - summary
        - allDay
    EventMembersUpdate:
      type: object
      properties:
        memberIds:
          type: array
          nullable: true
          items:
            type: string
            maxLength: 64
          maxItems: 20
      required:
        - memberIds
    WeatherResponse:
      type: object
      properties:
        weather:
          type: object
          nullable: true
          properties:
            label:
              type: string
            fetchedAt:
              type: string
            current:
              type: object
              properties:
                tempC:
                  type: number
                code:
                  type: integer
                isDay:
                  type: boolean
              required:
                - tempC
                - code
                - isDay
            daily:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  code:
                    type: integer
                  tempMinC:
                    type: number
                  tempMaxC:
                    type: number
                required:
                  - date
                  - code
                  - tempMinC
                  - tempMaxC
          required:
            - label
            - fetchedAt
            - current
            - daily
      required:
        - weather
    ChoreList:
      type: object
      properties:
        chores:
          type: array
          items:
            $ref: "#/components/schemas/Chore"
      required:
        - chores
    Chore:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        notes:
          type: string
          nullable: true
        emoji:
          type: string
          nullable: true
        starValue:
          type: integer
        upForGrabs:
          type: boolean
        dueDate:
          type: string
          nullable: true
        dueMode:
          type: string
          nullable: true
          enum:
            - on
            - by
            - null
        dueTime:
          type: string
          nullable: true
        recurrence:
          type: object
          nullable: true
          properties:
            freq:
              type: string
              enum:
                - daily
                - weekly
                - monthly
            interval:
              type: integer
              minimum: 1
              maximum: 365
            byWeekday:
              type: array
              items:
                type: string
                enum:
                  - mo
                  - tu
                  - we
                  - th
                  - fr
                  - sa
                  - su
              maxItems: 7
            byMonthDay:
              type: integer
              minimum: 1
              maximum: 31
            startDate:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
            endDate:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
          required:
            - freq
            - startDate
        assigneeIds:
          type: array
          items:
            type: string
        sortOrder:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - title
        - notes
        - emoji
        - starValue
        - upForGrabs
        - dueDate
        - dueMode
        - dueTime
        - recurrence
        - assigneeIds
        - sortOrder
        - createdAt
    ChoreCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        notes:
          type: string
          nullable: true
          minLength: 1
          maxLength: 1000
        emoji:
          type: string
          nullable: true
          minLength: 1
          maxLength: 16
        starValue:
          type: integer
          minimum: 0
          maximum: 100
        upForGrabs:
          type: boolean
        dueDate:
          type: string
          nullable: true
          pattern: ^\d{4}-\d{2}-\d{2}$
        dueMode:
          type: string
          nullable: true
          enum:
            - on
            - by
            - null
        dueTime:
          type: string
          nullable: true
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        recurrence:
          type: object
          nullable: true
          properties:
            freq:
              type: string
              enum:
                - daily
                - weekly
                - monthly
            interval:
              type: integer
              minimum: 1
              maximum: 365
            byWeekday:
              type: array
              items:
                type: string
                enum:
                  - mo
                  - tu
                  - we
                  - th
                  - fr
                  - sa
                  - su
              maxItems: 7
            byMonthDay:
              type: integer
              minimum: 1
              maximum: 31
            startDate:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
            endDate:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
          required:
            - freq
            - startDate
        assigneeIds:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 20
        sortOrder:
          type: integer
          minimum: 0
          maximum: 10000
      required:
        - title
    ChoreUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        notes:
          type: string
          nullable: true
          minLength: 1
          maxLength: 1000
        emoji:
          type: string
          nullable: true
          minLength: 1
          maxLength: 16
        starValue:
          type: integer
          minimum: 0
          maximum: 100
        upForGrabs:
          type: boolean
        dueDate:
          type: string
          nullable: true
          pattern: ^\d{4}-\d{2}-\d{2}$
        dueMode:
          type: string
          nullable: true
          enum:
            - on
            - by
            - null
        dueTime:
          type: string
          nullable: true
